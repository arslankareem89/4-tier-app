name: Test and Deploy 4-Tier App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Backend and Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run backend tests
        working-directory: backend
        run: |
          PYTHONPATH=. python -m pytest -v -p no:cacheprovider

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "707575990308"
      ECR_REGISTRY: 707575990308.dkr.ecr.us-east-1.amazonaws.com
      ECR_REPOSITORY: 4-tier-app-backend
      ECS_CLUSTER: 4-tier-app-dev-backend
      ECS_SERVICE: 4-tier-app-dev-backend
      CACHE_REPLICATION_GROUP_ID: tierapp-dev-cache
      UPLOAD_QUEUE_NAME: 4-tier-app-dev-upload-processing
      WORKER_ECS_SERVICE: 4-tier-app-dev-backend-worker
      FRONTEND_BUCKET: 4-tier-app-dev-frontend-707575990308
      CLOUDFRONT_DISTRIBUTION_ID: E3TCGFC1YZ2995
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          test -s dist/index.html

      - name: Build backend Docker image
        run: |
          docker build --pull \
            -f backend/Dockerfile \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            backend

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::707575990308:role/4-tier-app-github-actions-deploy
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: us-east-1
          allowed-account-ids: "707575990308"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "$ECR_REGISTRY"

      - name: Push backend image to ECR
        run: |
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

      - name: Register API task definition
        id: task-definition
        shell: bash
        run: |
          set -euo pipefail

          CACHE_ENDPOINT=$(aws elasticache describe-replication-groups \
            --replication-group-id "$CACHE_REPLICATION_GROUP_ID" \
            --query 'ReplicationGroups[0].NodeGroups[0].PrimaryEndpoint.Address' \
            --output text)

          UPLOAD_QUEUE_URL=$(aws sqs get-queue-url \
            --queue-name "$UPLOAD_QUEUE_NAME" \
            --query 'QueueUrl' \
            --output text)

          if [[ -z "$CACHE_ENDPOINT" || "$CACHE_ENDPOINT" == "None" ]]; then
            echo "::error::Valkey endpoint was not found."
            exit 1
          fi

          if [[ -z "$UPLOAD_QUEUE_URL" || "$UPLOAD_QUEUE_URL" == "None" ]]; then
            echo "::error::SQS upload queue URL was not found."
            exit 1
          fi

          CACHE_URL="rediss://${CACHE_ENDPOINT}:6379/0"
          echo "CACHE_URL=$CACHE_URL" >> "$GITHUB_ENV"
          echo "UPLOAD_QUEUE_URL=$UPLOAD_QUEUE_URL" >> "$GITHUB_ENV"

          CURRENT_TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [[ -z "$CURRENT_TASK_DEFINITION" || "$CURRENT_TASK_DEFINITION" == "None" ]]; then
            echo "::error::Could not resolve the active API task definition."
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEFINITION" \
            --query 'taskDefinition' \
            --output json \
            > /tmp/current-api-task-definition.json

          jq --arg image "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            --arg cache_url "$CACHE_URL" \
            --arg queue_url "$UPLOAD_QUEUE_URL" '
            if ([.containerDefinitions[] | select(.name == "backend")] | length) != 1 then
              error("Expected exactly one container named backend")
            else
              .containerDefinitions |= map(
                if .name == "backend" then
                  .image = $image
                  | .environment = (
                      ((.environment // []) |
                        map(select(.name != "CACHE_URL" and .name != "SQS_QUEUE_URL")))
                      + [
                          {"name": "CACHE_URL", "value": $cache_url},
                          {"name": "SQS_QUEUE_URL", "value": $queue_url}
                        ]
                    )
                else . end
              )
              | del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy,
                  .deregisteredAt,
                  .deregisteredBy
                )
            end
          ' /tmp/current-api-task-definition.json \
            > /tmp/new-api-task-definition.json

          NEW_API_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/new-api-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "TASK_DEFINITION_ARN=$NEW_API_TASK_DEFINITION" >> "$GITHUB_ENV"
          echo "Registered API task definition."

      - name: Deploy API to ECS
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN"

      - name: Wait for API service to become stable
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      - name: Register worker task definition
        shell: bash
        run: |
          set -euo pipefail

          WORKER_CURRENT_TASK_DEFINITION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$WORKER_ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [[ -z "$WORKER_CURRENT_TASK_DEFINITION" || "$WORKER_CURRENT_TASK_DEFINITION" == "None" ]]; then
            echo "::error::Could not resolve the worker task definition."
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$WORKER_CURRENT_TASK_DEFINITION" \
            --query 'taskDefinition' \
            --output json \
            > /tmp/current-worker-task-definition.json

          jq --arg image "${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}" \
            --arg cache_url "$CACHE_URL" \
            --arg queue_url "$UPLOAD_QUEUE_URL" '
            if ([.containerDefinitions[] | select(.name == "upload-worker")] | length) != 1 then
              error("Expected exactly one container named upload-worker")
            else
              .containerDefinitions |= map(
                if .name == "upload-worker" then
                  .image = $image
                  | .command = ["python", "worker.py"]
                  | .environment = (
                      ((.environment // []) |
                        map(select(.name != "CACHE_URL" and .name != "SQS_QUEUE_URL")))
                      + [
                          {"name": "CACHE_URL", "value": $cache_url},
                          {"name": "SQS_QUEUE_URL", "value": $queue_url}
                        ]
                    )
                else . end
              )
              | del(
                  .taskDefinitionArn,
                  .revision,
                  .status,
                  .requiresAttributes,
                  .compatibilities,
                  .registeredAt,
                  .registeredBy,
                  .deregisteredAt,
                  .deregisteredBy
                )
            end
          ' /tmp/current-worker-task-definition.json \
            > /tmp/new-worker-task-definition.json

          NEW_WORKER_TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/new-worker-task-definition.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "WORKER_TASK_DEFINITION_ARN=$NEW_WORKER_TASK_DEFINITION" >> "$GITHUB_ENV"
          echo "Registered worker task definition."

      - name: Deploy worker service
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$WORKER_ECS_SERVICE" \
            --task-definition "$WORKER_TASK_DEFINITION_ARN" \
            --desired-count 1

      - name: Wait for worker service to become stable
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$WORKER_ECS_SERVICE"

      - name: Upload frontend to S3
        run: |
          aws s3 sync frontend/dist/ \
            "s3://${FRONTEND_BUCKET}/" \
            --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

      - name: Report deployment
        run: |
          echo "Deployment workflow completed."
          echo "Commit: $GITHUB_SHA"
          echo "Frontend: https://dii6w08edudfe.cloudfront.net"
